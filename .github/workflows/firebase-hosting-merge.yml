# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile && pnpm validate && pnpm build
        # see docs/sentry.md; PR previews build without, so Sentry is off there
        env:
          SENTRY_DSN: '${{ vars.SENTRY_DSN }}'
          SENTRY_ORG: '${{ vars.SENTRY_ORG }}'
          SENTRY_PROJECT: '${{ vars.SENTRY_PROJECT }}'
          SENTRY_AUTH_TOKEN: '${{ secrets.SENTRY_AUTH_TOKEN }}'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAX_CUT_AND_COLOR }}'
      - uses: google-github-actions/setup-gcloud@v2
      # Rules first: the server's pages link Storage images that only the
      # storage rules make public. The Firebase CLI picks up the credentials
      # the auth step exported.
      - run: npm install -g firebase-tools@15 && pnpm release:rules
      # Server before Hosting: its pages link the new hashed assets, which the
      # server also ships, so they load from it until Hosting has them
      - run: pnpm release:server
      - uses: FirebaseExtended/action-hosting-deploy@v0.11
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAX_CUT_AND_COLOR }}'
          channelId: live
          projectId: sax-cut-and-color
