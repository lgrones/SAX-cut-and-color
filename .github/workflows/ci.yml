# Checks a PR builds and passes validation. No preview deploy: Hosting rewrites
# every page to the live Cloud Run service, so a preview channel would show
# production pages instead of the PR's
name: Check PR
'on': pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile && pnpm validate && pnpm build
